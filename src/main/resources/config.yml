# Light item display custom blocks per face, like Minecraft does: the block is rendered as 6 flat displays
# (one per face), each lit by the block laid against it. Costs 6 entities per block instead of 1.
# When disabled, a single display is used, lit by the brightest of the 6 neighbour blocks.
preciseLightning: true

# The maximum distance (in chunks) a player can tick item display custom blocks
viewDistance: 6

# Server driven mining of custom blocks that declare their own MiningProperties
customMining: true

# Radius (in blocks) in which the block cracking animation is shown to other players
miningDamageRadius: 16
