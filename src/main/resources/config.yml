# Verify lightning like Minecraft or do a less precise one by checking the upper block (which may cause the block to be black)
preciseLightning: true

# The maximum distance (in chunks) a player can tick item display custom blocks
viewDistance: 6

# Server driven mining of custom blocks that declare their own MiningProperties
customMining: true

# Radius (in blocks) in which the block cracking animation is shown to other players
miningDamageRadius: 16
